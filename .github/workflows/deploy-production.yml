name: Deploy production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --dir apps/api exec prisma generate

      - name: Apply production migrations
        run: pnpm --dir apps/api exec prisma migrate deploy

      # Add the Worker deployment here once Hono + Wrangler are configured.
      # - name: Deploy Worker
      #   run: pnpm --dir apps/api exec wrangler deploy --env production
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
